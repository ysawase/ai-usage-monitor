name: Isolated Windows GUI smoke QA

on:
  push:
    branches:
      - qa/isolated-gui-smoke-20261104

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA source without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight disposable interactive Windows VM
        id: preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cs = Get-CimInstance Win32_ComputerSystem
          $model = [string]$cs.Model
          $sid = [Diagnostics.Process]::GetCurrentProcess().SessionId
          $interactive = [Environment]::UserInteractive
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          $vm = $model -match '(?i)virtual machine|vmware|virtualbox|kvm|qemu|parallels|virtual platform'
          $eligible = $vm -and $interactive -and $sid -ne 0 -and $identity -ne 'NT AUTHORITY\SYSTEM'
          $obj = [ordered]@{ source_sha = $env:GITHUB_SHA; model = $model; session = $sid; interactive = $interactive; vm = $vm; eligible = $eligible; status = 'probe_only' }
          $obj | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'aum-gui-preflight.json') -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('eligible=' + $eligible.ToString().ToLowerInvariant()) -Encoding ASCII
          Write-Output ('GUI_PREFLIGHT_ELIGIBLE=' + $eligible)
      - name: Parse UTF-8 smoke script before build
        if: steps.preflight.outputs.eligible == 'true'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\qa-isolated-help-smoke.ps1').Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Output 'UTF8_POWERSHELL_PARSE_PASS'
      - name: Install Rust toolchain
        if: steps.preflight.outputs.eligible == 'true'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Inject diagnostic fixtures into ephemeral checkout
        if: steps.preflight.outputs.eligible == 'true'
        shell: pwsh
        run: |
          python .\scripts\qa-inject-diagnosis-fixtures.py
          cargo fmt --all
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build QA EXE
        if: steps.preflight.outputs.eligible == 'true'
        shell: pwsh
        run: cargo build --locked --no-default-features --features antigravity --release
      - name: Run synthetic help and diagnostic dialogs with clean process environment
        if: steps.preflight.outputs.eligible == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe=(Resolve-Path '.\target\release\claude-code-usage-monitor.exe').Path
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          & '.\scripts\qa-isolated-help-smoke.ps1' -ExePath $exe -ExpectedSha256 $sha -EvidencePath (Join-Path $env:RUNNER_TEMP 'aum-gui-smoke.json') -RunInIsolatedGuest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $json=Get-Content (Join-Path $env:RUNNER_TEMP 'aum-gui-smoke.json') -Raw | ConvertFrom-Json
          if ($json.status -ne 'pass_help_diagnostics_antigravity_reposition_own_window_probe' -or -not $json.process_exited -or -not $json.dialog_owner_verified -or -not $json.env_scrubbed -or @($json.fixture_cases).Count -ne 5 -or @($json.fixture_cases | Where-Object { $_.status -ne 'pass' }).Count -gt 0 -or $json.help_attention_click.status -ne 'pass' -or $json.help_attention_click.diagnosis -ne 'Claude Code (session)' -or $json.help_attention_click.physical_mouse_tested -ne $false -or $json.os_mouse_click.status -ne 'pass' -or $json.os_mouse_click.mode -ne 'os_sendinput_owned_mouse' -or $json.os_mouse_click.own_window_target_verified -ne $true -or $json.os_mouse_click.no_foreground_activation_requested -ne $true -or $json.os_mouse_click.session_diagnosis_verified -ne $true -or $json.os_mouse_click.human_physical_mouse_tested -ne $false -or $json.antigravity.setup_dialog -ne 'pass' -or $json.antigravity.connection_dialog -ne 'pass' -or -not $json.antigravity.external_guide_declined -or $json.popup_position.status -ne 'pass' -or $json.popup_position.tray_reposition_handler -ne 'pass' -or $json.popup_position.displaychange_handler -ne 'pass' -or $json.popup_position.natural_winevent_tested -ne $false -or $json.popup_position.own_window_winevent_tested -ne $true -or $json.popup_position.own_window_dispatch_to_product_handler -ne 'pass' -or $json.popup_position.explorer_tray_touched -ne $false) { throw 'GUI evidence did not satisfy acceptance checks.' }
      - name: Upload preflight and scoped GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aum-isolated-gui-smoke-evidence
          path: |
            ${{ runner.temp }}/aum-gui-preflight.json
            ${{ runner.temp }}/aum-gui-smoke.json
          if-no-files-found: warn
          retention-days: 7
